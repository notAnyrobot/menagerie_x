[project]
name = "menagerie_x"
version = "0.1.0"
description = "Robot-description asset menagerie and browser workbench for the Dobot Astro humanoid"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.2.0",
]

[project.optional-dependencies]
viz = [
    "trimesh>=4.0.0",
    "viser>=1.0.0",
]

[project.scripts]
menagerie_x = "menagerie_x.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/menagerie_x"]

[tool.uv]
package = true

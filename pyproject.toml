[project]
name = "menagerie_x"
version = "0.1.0"
description = "Multi-robot description asset catalog and browser workbench"
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.11.0",
]

[project.urls]
Repository = "https://github.com/notAnyrobot/menagerie_x"

[project.optional-dependencies]
viz = [
    "trimesh>=4.0.0",
    "viser>=1.0.0",
]

[project.scripts]
menagerie_x = "menagerie_x.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/menagerie_x"]

[tool.hatch.build.targets.sdist]
only-include = ["src/menagerie_x", "robots", "tests", "docs", "README.md", "CONTEXT.md", "pyproject.toml", "uv.lock"]

[tool.uv]
package = true

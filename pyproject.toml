[project]
name = "menagerie_x"
version = "0.1.0"
description = "Curated native MuJoCo robot models and scenes"
requires-python = ">=3.12"
dependencies = [
    "mujoco==3.11.0",
]

[project.urls]
Repository = "https://github.com/notAnyrobot/menagerie_x"

[project.optional-dependencies]
dev = ["lxml>=6.0.0"]
viz = [
    "trimesh>=4.0.0",
    "viser>=1.0.0",
]

[project.scripts]
menagerie_x = "menagerie_x.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/menagerie_x"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/menagerie_x", "manifest.json",
    "astro_p1", "astro_p2", "astro_p2_29dof", "astro_p2_43dof_dex3_1",
    "atom_p3", "soma23", "unitree_g1", "robots", "scenes", "terrains",
    "test", "tests", "docs", "LICENSES", "README.md", "CONTEXT.md",
    "CONTRIBUTING.md", "GLOSSARY.md", "CHANGELOG.md", "UPSTREAM.md", "LICENSING.md",
    "catalog.py", "format_xml.py", "hatch_build.py", "Makefile", "pyproject.toml", "uv.lock",
    "scripts/build-astro-dex3-variant.py", "scripts/build-astro-mjcf.py",
    "scripts/render-astro-dex3-preview.py", "scripts/validate-astro-dex3-variant.py",
]
# Local floating-model conversion experiments are not curated catalog assets.
exclude = ["**/*.floating_mjcf.xml"]

# Source archives retain the checkout's relative compatibility links.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.uv]
package = true

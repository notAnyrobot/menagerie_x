[project]
name = "astro-description"
version = "0.1.0"
description = "Python tools and robot-description assets for the Dobot Astro humanoid"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=3.2.0",
]

[project.optional-dependencies]
viz = [
    "trimesh>=4.0.0",
    "viser>=1.0.0",
]

[project.scripts]
astro = "astro_description.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astro_description"]

[tool.uv]
package = true

# Astro P2 29 DOF: head_joint is fixed at zero, with head geometry and inertia retained.
# This directory is the canonical, self-contained HHTools robot bundle.
# Calibrate for each motion reference before retargeting.
name: astro_p2_29dof
display_name: Astro P2 29 DOF (fixed head, primitive collision)
urdf: astro_p2_29dof.urdf
mesh_search_paths:
- meshes
length_scale: 1.0
up_axis: Z
forward_axis: X
dof_order:
- left_hip_pitch_joint
- left_hip_roll_joint
- left_hip_yaw_joint
- left_knee_joint
- left_ankle_pitch_joint
- left_ankle_roll_joint
- right_hip_pitch_joint
- right_hip_roll_joint
- right_hip_yaw_joint
- right_knee_joint
- right_ankle_pitch_joint
- right_ankle_roll_joint
- waist_yaw_joint
- waist_pitch_joint
- waist_roll_joint
- left_shoulder_pitch_joint
- left_shoulder_roll_joint
- left_shoulder_yaw_joint
- left_elbow_joint
- left_wrist_roll_joint
- left_wrist_pitch_joint
- left_wrist_yaw_joint
- right_shoulder_pitch_joint
- right_shoulder_roll_joint
- right_shoulder_yaw_joint
- right_elbow_joint
- right_wrist_roll_joint
- right_wrist_pitch_joint
- right_wrist_yaw_joint
ik_map:
  hips: pelvis
  spine: waist_pitch_link
  chest: torso_link
  left_shoulder: left_shoulder_pitch_link
  left_elbow: left_elbow_link
  left_wrist: left_hand_link
  right_shoulder: right_shoulder_pitch_link
  right_elbow: right_elbow_link
  right_wrist: right_hand_link
  left_hip: left_hip_roll_link
  left_knee: left_knee_link
  left_ankle: left_ankle_roll_link
  right_hip: right_hip_roll_link
  right_knee: right_knee_link
  right_ankle: right_ankle_roll_link
weights:
  t_weight:
    hips: 10.0
    chest: 0.5
    left_shoulder: 0.5
    left_elbow: 1.0
    left_wrist: 1.0
    right_shoulder: 0.5
    right_elbow: 1.0
    right_wrist: 1.0
    left_hip: 0.5
    left_knee: 1.0
    left_ankle: 2.0
    right_hip: 0.5
    right_knee: 1.0
    right_ankle: 2.0
  r_weight:
    hips: 2.0
    chest: 0.5
    left_shoulder: 0.1
    left_elbow: 0.5
    left_wrist: 0.5
    right_shoulder: 0.1
    right_elbow: 0.5
    right_wrist: 0.5
    left_hip: 0.2
    left_knee: 0.5
    left_ankle: 1.0
    right_hip: 0.2
    right_knee: 0.5
    right_ankle: 1.0
smooth_joint_filter_masks:
  left_shoulder_pitch_link: 0.1
  left_shoulder_roll_link: 1.0
  left_shoulder_yaw_link: 0.3
  left_hip_roll_link: 0.1
  left_hip_yaw_link: 0.3
  left_knee_link: 0.1
  right_shoulder_pitch_link: 0.1
  right_shoulder_roll_link: 1.0
  right_shoulder_yaw_link: 0.3
  right_hip_roll_link: 0.1
  right_hip_yaw_link: 0.3
  right_knee_link: 0.1
feet:
  left_contact_link: left_ankle_roll_link
  right_contact_link: right_ankle_roll_link
  ground_z: 0.0
  foot_height: 0.02
rest_offsets: {}
retarget:
  num_initialization_frames: 10
  num_stabilization_frames: 5
  apply_feet_stabilizer: true
  feet_stabilizer:
    ground_contact_z: 0.0
    min_foot_clearance: 0.02
  foot_clamp_max_lift_rate: 0.02

name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/menagerie_x/workbench/web/package-lock.json
      - name: Install headless rendering dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - name: Install project dependencies
        run: make install
      - name: Check models and Workbench
        run: make all
